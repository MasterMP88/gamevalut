name: GANG core

on:
  pull_request:
    paths:
      - "packages/gang-core/**"
      - "docs/gang-mode-product-spec.md"
      - ".github/workflows/gang-core.yml"
  push:
    branches: [main]
    paths:
      - "packages/gang-core/**"
      - "docs/gang-mode-product-spec.md"
      - ".github/workflows/gang-core.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gang-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/gang-core/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
