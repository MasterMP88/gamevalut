name: App quality

on:
  pull_request:
    paths:
      - "src/**"
      - "packages/gang-core/**"
      - "scripts/vendor-cores.mjs"
      - "scripts/check-deployment.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/app-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/gang-core/**"
      - "scripts/vendor-cores.mjs"
      - "scripts/check-deployment.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/app-quality.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: |
          npm install --global npm@11.9.0 --no-audit --no-fund
          npm ci --include=dev --no-audit --no-fund
      - name: Verify canonical core parity
        run: |
          node scripts/vendor-cores.mjs
          git diff --exit-code -- src/lib/gang/core src/lib/commerce/core
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
        run: npm run build
      - name: Verify the built Cloudflare worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm run preview -- --port 4182 > /tmp/nocturne-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4182/api/public/health > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/check-deployment.mjs http://127.0.0.1:4182 || { cat /tmp/nocturne-preview.log; exit 1; }
