name: App quality

on:
  pull_request:
    paths:
      - "src/**"
      - "packages/gang-core/**"
      - "scripts/vendor-cores.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/app-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/gang-core/**"
      - "scripts/vendor-cores.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/app-quality.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: |
          npm install --global npm@11.9.0 --no-audit --no-fund
          npm ci --include=dev --no-audit --no-fund
      - name: Verify canonical core parity
        run: |
          node scripts/vendor-cores.mjs
          git diff --exit-code -- src/lib/gang/core src/lib/commerce/core
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
