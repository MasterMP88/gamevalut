name: Deploy Game Vault to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/gang-core/package.json

      - name: Build GANG core
        working-directory: packages/gang-core
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Validate GANG browser shell
        run: |
          for f in gang/*.js; do node --check "$f"; done
          ! grep -Eiq 'PROTOTYPE|IN DEVELOPMENT|MULTIPLAYER RUNTIME.*COMING NEXT|heute noch nichts spielbar' gang/index.html gang/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package legacy public files only
        run: node scripts/package-pages.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
